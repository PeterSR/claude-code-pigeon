version: 2

project_name: pigeon

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pigeon
    main: ./cmd/pigeon
    binary: pigeon
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
    # Plugin monitors only exist on Unix, so Windows is not shipped as a
    # release artifact even though the code compiles for it.

archives:
  - id: pigeon
    ids: [pigeon]
    # x86_64/arm64 rather than amd64, matching the author's other projects.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
      - docs/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  # No conventional-commit prefixes in this project's history, so grouping on
  # feat:/fix: would put every commit in "Other". Left ungrouped deliberately.
  filters:
    exclude:
      - Merge pull request
      - '^Merge branch'

release:
  # Drafted so the notes can be read before anything is public.
  draft: true
  prerelease: auto
  footer: |
    ## Install

    ```console
    go install github.com/PeterSR/claude-code-pigeon/cmd/pigeon@{{ .Tag }}
    pigeon install
    ```

    Then restart Claude Code. See the README for arming a single session
    without installing the plugin.
